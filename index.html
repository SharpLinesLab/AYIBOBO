<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ASF — Ayiti Sakap Fet · Music</title>
    <meta
      name="description"
      content="Stream kompa, rap kreyòl, afrobeats and more from Haiti and the diaspora. Charts, playlists, uploads and the ASF Boost Board."
    />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:title" content="ASF — Ayiti Sakap Fet · Music" />
    <meta property="og:description" content="Stream kompa, rap kreyòl, afrobeats and more from Haiti and the diaspora." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Poppins:ital,wght@1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('asf:theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font-family:sans-serif;color:#fff;background:#08090b;padding:24px">ASF needs JavaScript to play music. Please enable it and reload.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
